name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une nouvelle exécution annule la précédente sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé reste dans un ancien commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compiler et empaqueter (sans tests)
        run: mvn -B -ntp -DskipTests package

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build # les tests ne démarrent que si le build est vert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Lancer les tests (PostgreSQL 16 via Testcontainers)
        run: mvn -B -ntp verify
      - name: Rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
