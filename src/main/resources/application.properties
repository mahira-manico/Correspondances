spring.application.name=correspondances

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:correspondances}
spring.datasource.username=${DB_USER:correspondances}
spring.datasource.password=${DB_PASSWORD:correspondances}

# The schema is owned by Flyway: Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# Set to true to inspect generated SQL (e.g. N+1 diagnosis)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
