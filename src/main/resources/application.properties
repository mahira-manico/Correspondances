spring.application.name=correspondances

# Connexion PostgreSQL : valeurs par défaut alignées sur compose.yaml, surchargeables par variables d'environnement
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:correspondances}
spring.datasource.username=${DB_USER:correspondances}
spring.datasource.password=${DB_PASSWORD:correspondances}

# Le schéma est géré uniquement par Flyway : Hibernate vérifie, il ne crée ni ne modifie jamais rien
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migrations versionnées : src/main/resources/db/migration (V1__init.sql, V2__..., etc.)
spring.flyway.locations=classpath:db/migration

# Log SQL d'Hibernate : passer à true pour diagnostiquer un N+1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
