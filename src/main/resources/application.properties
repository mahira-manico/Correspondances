spring.application.name=correspondances

# 8080 often falls in Windows reserved port ranges (Hyper-V / WSL)
server.port=${CORRESPONDANCES_SERVER_PORT:18080}

spring.datasource.url=jdbc:postgresql://${CORRESPONDANCES_DB_HOST:localhost}:${CORRESPONDANCES_DB_PORT:15432}/${CORRESPONDANCES_DB_NAME:correspondances}
spring.datasource.username=${CORRESPONDANCES_DB_USER:correspondances}
spring.datasource.password=${CORRESPONDANCES_DB_PASSWORD:correspondances}

# The schema is owned by Flyway: Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# Set to true to inspect generated SQL (e.g. N+1 diagnosis)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
