# PostgreSQL 16 pour le développement local.
# Démarrage : docker compose up -d
# Exposé sur le port 15432 : ni le 5432 d'un PostgreSQL déjà installé sur le poste,
# ni une plage réservée par Windows/Hyper-V (5433-5532 l'est souvent).
# Les valeurs par défaut peuvent être surchargées par un fichier .env (non versionné, lu par Docker Compose uniquement).
services:
  postgres:
    image: postgres:16
    container_name: correspondances-db
    environment:
      POSTGRES_DB: ${DB_NAME:-correspondances}
      POSTGRES_USER: ${DB_USER:-correspondances}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-correspondances}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-correspondances} -d ${DB_NAME:-correspondances}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
