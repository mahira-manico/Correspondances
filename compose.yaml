# Port 15432 avoids a locally installed PostgreSQL (5432) and Windows reserved port ranges (often 5433-5532).
services:
  postgres:
    image: postgres:16
    container_name: correspondances-db
    environment:
      POSTGRES_DB: ${DB_NAME:-correspondances}
      POSTGRES_USER: ${DB_USER:-correspondances}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-correspondances}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-correspondances} -d ${DB_NAME:-correspondances}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
